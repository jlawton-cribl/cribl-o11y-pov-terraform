# ========================================
# DAY 4: FLUENT BIT HELM VALUES
# ========================================

# Fluent Bit configuration for Splunk HEC output with TLS 1.3

image:
  repository: fluent/fluent-bit
  tag: 2.1.8

# Global configuration
config:
  # Service configuration
  service: |
    [SERVICE]
        Daemon Off
        Flush 1
        Log_Level info
        Parsers_File parsers.conf
        Parsers_File custom_parsers.conf
        HTTP_Server Off
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020
        Health_Check On

  # Input: Tail - read logs from containers
  inputs: |
    [INPUT]
        Name tail
        Tag kube.*
        Path /var/log/containers/*.log
        Parser docker
        DB /var/log/flb_kube.db
        Mem_Buf_Limit 50MB
        Skip_Long_Lines On
        Refresh_Interval 10
        Read_from_Head On

    [INPUT]
        Name systemd
        Tag host.*
        Path /var/log/journal
        Read_From_Tail On
        Strip_Underscores On

  # Filters
  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*
        Kube_URL https://kubernetes.default.svc:443
        Kube_CA_File /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix kube.var.log.containers.
        Merge_Log On
        Keep_Log Off
        K8S-Logging.Parser On
        K8S-Logging.Exclude On

    [FILTER]
        Name modify
        Match *
        Add environment production
        Add cluster cribl-o11y-pov

  # Output: Splunk HEC
  outputs: |
    [OUTPUT]
        Name splunk
        Match *
        Host <HEC_ENDPOINT>
        Port 8088
        Token <HEC_AUTH_TOKEN>
        TLS On
        TLS.Verify Off
        TLS.Vhost <HEC_ENDPOINT>
        TLS.Min_Version 1.3
        Event_Source kubernetes
        Event_Sourcetype logs
        Event_Key log
        Splunk_Token <HEC_AUTH_TOKEN>
        Use_HTTPS On
        JSON_Date_Key timestamp
        Compress gzip
        Retry_Limit 3

  # Custom parsers for structured logs
  customParsers: |
    [PARSER]
        Name json
        Format json
        Time_Key timestamp
        Time_Format %Y-%m-%dT%H:%M:%SZ
        Decode_Field_As json log

    [PARSER]
        Name docker
        Format json
        Time_Key time
        Time_Format %Y-%m-%dT%H:%M:%S.%LZ
        Time_Keep On
        Decode_Field_As json log

    [PARSER]
        Name syslog
        Format regex
        Regex ^(?<time>[^ ]+ [^ ]+) (?<host>[^ ]*) (?<ident>[a-zA-Z0-9_\/\.\-]*)(?:\[(?<pid>[0-9]+)\])?(?:[^\:]*\:)? *(?<message>.*)$
        Time_Key time
        Time_Format %b %d %H:%M:%S

# Service account for Fluent Bit
serviceAccount:
  create: true
  annotations: {}
  name: fluent-bit

# RBAC configuration
rbac:
  create: true

# DaemonSet to run Fluent Bit on all nodes
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "2020"
  prometheus.io/path: "/api/v1/metrics/prometheus"

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Tolerations for node selectors
tolerations:
  - effect: NoSchedule
    key: node-role.kubernetes.io/master
    operator: Exists

# Node selector
nodeSelector: {}

# Host networking for access to host logs
hostNetwork: false
dnsPolicy: ClusterFirst

# Volume mounts for container and host logs
volumeMounts:
  - name: varlog
    mountPath: /var/log
    readOnly: true
  - name: varlibdockercontainers
    mountPath: /var/lib/docker/containers
    readOnly: true
  - name: etcmachineid
    mountPath: /etc/machine-id
    readOnly: true

volumes:
  - name: varlog
    hostPath:
      path: /var/log
  - name: varlibdockercontainers
    hostPath:
      path: /var/lib/docker/containers
  - name: etcmachineid
    hostPath:
      path: /etc/machine-id
      type: File

# Autoscaling disabled for DaemonSet
autoscaling:
  enabled: false

# Service
service:
  type: ClusterIP
  port: 24224
