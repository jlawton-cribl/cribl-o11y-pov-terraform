# Reduce Pipeline - drop low-value logs, apply sampling, reduce volume
# Purpose: Optimize data retention by filtering noise and applying intelligent sampling
#
# Functions:
# 1. filter_debug_prod - Drop DEBUG logs in production
# 2. drop_empty - Remove events with empty messages
# 3. drop_noise - Filter out health checks and noise
# 4. dynamic_sampling - Apply logarithmic sampling to reduce ingest volume
# 5. compress - Mark for compression in downstream destinations

functions:
  - id: filter_debug_prod
    filter: "(__e['environment'] === 'prod' || __e['environment'] === 'production') && (__e['severity'] === 'DEBUG' || __e['severity'] === 'debug')"
    disabled: false
    type: drop
    conf:
      comment: "Drop DEBUG logs in production - too verbose"

  - id: filter_info_prod
    filter: "(__e['environment'] === 'prod' || __e['environment'] === 'production') && (__e['severity'] === 'INFO' && __e['message'] && __e['message'].match(/health|heartbeat|ping|keepalive/i))"
    disabled: false
    type: drop
    conf:
      comment: "Drop health check logs"

  - id: drop_empty
    filter: "!__e['message'] || __e['message'].length === 0 || __e['message'] === 'null'"
    disabled: false
    type: drop
    conf:
      comment: "Drop events with empty/null messages"

  - id: dynamic_sampling
    filter: "(__e['severity'] === 'DEBUG' || __e['severity'] === 'INFO')"
    disabled: false
    type: sample
    conf:
      rate: 0.1
      seed: "__e['namespace']"
      comment: "Sample 10% of debug/info logs by namespace"

  - id: add_processing_metadata
    filter: "true"
    disabled: false
    type: eval
    conf:
      add:
        _cribl_processed: "new Date().toISOString()"
        _volume_reduced: "true"
      remove: []
      keep:
        - "*"

description: "Reduce volume by filtering noise, applying dynamic sampling, and optimizing for storage"
